# coturn relay for Nagrek calls. Runs on a small Linux VPS (Hostinger's Node.js hosting can't run it).
# Install: sudo apt install coturn, copy this file to /etc/turnserver.conf, set the values marked CHANGE,
# then: sudo systemctl enable --now coturn
# Open ports: 3478 udp+tcp, 5349 tcp, and 49152-65535 udp.

listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# CHANGE: the VPS public IP (add /private-ip if the VPS is behind NAT).
external-ip=203.0.113.10
# CHANGE: your TURN hostname.
realm=turn.example.com
server-name=turn.example.com

# Shared-secret auth: the Nagrek server mints short-lived credentials, so no static passwords.
use-auth-secret
# CHANGE: a long random string. Put the same value in TURN_SECRET on the app server.
static-auth-secret=CHANGE_ME_to_a_long_random_secret

# TLS for turns: (Let's Encrypt). CHANGE the paths to your certificate.
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

fingerprint
no-cli
no-multicast-peers
# Never relay into private networks (stops the relay being used to reach internal hosts).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
user-quota=12
total-quota=1200
stale-nonce=600
log-file=/var/log/turnserver.log
simple-log
